<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI ПОИСК — AI ОБНАРУЖЕНИЕ</title>

<meta
    name="description"
    content="AI ПОИСК — проект с приложением AI ОБНАРУЖЕНИЕ для Windows. Распознавание объектов через камеру, вероятность обнаружения, русская озвучка, звуковой сигнал и сохранение фотографий."
>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top, #243b55 0%, #101827 40%, #070b12 100%);
    color: #ffffff;
    line-height: 1.6;
}

.container {
    width: min(1100px, 92%);
    margin: auto;
}

/* ============================= */
/* HEADER */
/* ============================= */

header {
    padding: 24px 0;
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(7, 11, 18, 0.90);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

.logo {
    font-size: 25px;
    font-weight: 800;
}

.logo span {
    color: #4da3ff;
}

nav a {
    color: #ffffff;
    text-decoration: none;
    margin-left: 20px;
    opacity: 0.85;
}

nav a:hover {
    color: #4da3ff;
    opacity: 1;
}

/* ============================= */
/* HERO */
/* ============================= */

.hero {
    text-align: center;
    padding: 100px 20px 90px;
}

.badge {
    display: inline-block;
    padding: 8px 16px;
    border-radius: 30px;
    background: rgba(77,163,255,0.12);
    border: 1px solid rgba(77,163,255,0.35);
    color: #78bcff;
    margin-bottom: 25px;
}

.hero h1 {
    font-size: clamp(48px, 8vw, 90px);
    line-height: 1;
    margin-bottom: 25px;
}

.hero h1 .blue {
    color: #4da3ff;
}

.hero h1 .white {
    color: #ffffff;
}

.hero p {
    max-width: 820px;
    margin: auto;
    font-size: 21px;
    color: #cbd5e1;
}

.buttons {
    margin-top: 40px;
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
}

.btn {
    display: inline-block;
    padding: 16px 30px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 800;
    font-size: 17px;
    transition: 0.2s;
}

.btn.primary {
    background: #4da3ff;
    color: #07111f;
    box-shadow: 0 10px 30px rgba(77,163,255,0.25);
}

.btn.primary:hover {
    transform: translateY(-3px);
    background: #70b8ff;
}

.btn.secondary {
    border: 1px solid rgba(255,255,255,0.2);
    color: white;
}

.btn.secondary:hover {
    background: rgba(255,255,255,0.08);
}

/* ============================= */
/* SECTIONS */
/* ============================= */

section {
    padding: 75px 0;
}

.section-title {
    text-align: center;
    font-size: 38px;
    margin-bottom: 45px;
}

.section-subtitle {
    text-align: center;
    color: #aab7c7;
    max-width: 760px;
    margin: -25px auto 45px;
}

/* ============================= */
/* CARDS */
/* ============================= */

.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.card {
    background: rgba(255,255,255,0.055);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 18px;
    padding: 28px;
    backdrop-filter: blur(10px);
    transition: 0.2s;
}

.card:hover {
    border-color: rgba(77,163,255,0.35);
    transform: translateY(-3px);
}

.icon {
    font-size: 38px;
    margin-bottom: 15px;
}

.card h3 {
    font-size: 22px;
    margin-bottom: 10px;
}

.card p {
    color: #b9c5d3;
}

/* ============================= */
/* OBJECTS */
/* ============================= */

.objects {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 14px;
}

.object {
    padding: 14px 20px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 30px;
    font-size: 17px;
}

/* ============================= */
/* HOW TO USE */
/* ============================= */

.steps {
    display: grid;
    gap: 18px;
}

.step {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 18px;
    padding: 24px;
}

.step-number {
    display: inline-flex;
    width: 42px;
    height: 42px;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #4da3ff;
    color: #07111f;
    font-weight: 900;
    margin-bottom: 12px;
}

.step h3 {
    font-size: 21px;
    margin-bottom: 8px;
}

.step p {
    color: #bac5d3;
}

/* ============================= */
/* WARNING */
/* ============================= */

.warning {
    background: rgba(255, 170, 0, 0.08);
    border: 1px solid rgba(255, 190, 60, 0.30);
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 20px;
}

.warning h3 {
    color: #ffc857;
    margin-bottom: 12px;
    font-size: 23px;
}

.warning p {
    color: #d8dee8;
}

/* ============================= */
/* DOWNLOAD */
/* ============================= */

.download {
    text-align: center;
    background: rgba(77,163,255,0.06);
    border-top: 1px solid rgba(255,255,255,0.07);
    border-bottom: 1px solid rgba(255,255,255,0.07);
}

.download h2 {
    font-size: 42px;
    margin-bottom: 15px;
}

.download p {
    color: #b9c5d3;
    max-width: 720px;
    margin: auto;
}

.version {
    margin-top: 20px;
    color: #7dbfff;
    font-weight: bold;
}

/* ============================= */
/* PRIVACY */
/* ============================= */

.privacy {
    color: #c1cbd8;
}

.privacy strong {
    color: #ffffff;
}

/* ============================= */
/* FOOTER */
/* ============================= */

footer {
    padding: 35px 0;
    text-align: center;
    color: #7f8b9b;
    border-top: 1px solid rgba(255,255,255,0.07);
}

/* ============================= */
/* MOBILE */
/* ============================= */

@media (max-width: 800px) {

    .grid {
        grid-template-columns: 1fr;
    }

    .nav {
        flex-direction: column;
    }

    nav a {
        margin: 0 8px;
    }

    .hero {
        padding-top: 70px;
    }

    .hero p {
        font-size: 18px;
    }

    .section-title {
        font-size: 31px;
    }
}
</style>
</head>
